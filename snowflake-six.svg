  <g transform="translate(253 77) rotate(5) scale(0.1731)" stroke="#75B6D3" opacity="0.81"><use href="#six-arm-flake"/></g>
  <g transform="translate(165 121) rotate(33) scale(0.2923)" stroke="#125D8B" opacity="0.52"><use href="#six-arm-flake"/></g>
