<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYALE PRO · Clan Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bento-body">
<nav class="bento-nav">
  <div class="nav-brand">
    <span class="crown-logo">♛</span>
    <div class="brand-text">
      <span class="brand-title">ROYALE PRO</span>
      <span class="brand-sub">· CLAN ANALYTICS</span>
    </div>
    <span class="live-badge"><span class="live-dot"></span>LIVE ESPORTS ENGINE</span>
  </div>
  <div class="nav-controls">
    <input id="clan-tag-input" type="text" placeholder="#ClanTag" />
    <input id="api-token-input" type="text" placeholder="API Token" />
    <button id="btn-fetch" class="btn-primary">Quét Clan</button>
    <button id="btn-demo" class="btn-ghost">Clan Mẫu Pro</button>
  </div>
</nav>

<section class="bento-hero">
  <div id="clan-summary" class="clan-summary">
    <div class="clan-title-row">
      <h1 class="clan-name">Chưa tải dữ liệu</h1>
      <span class="clan-tag">#--------</span>
    </div>
    <div class="health-bar-wrap">
      <div class="health-bar"><div class="health-fill" style="width:0%"></div></div>
      <span class="health-label">Sức khỏe Clan: —</span>
    </div>
  </div>
  <div id="error-box" class="error-box" hidden></div>
</section>
