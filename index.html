<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoyaleAPI Clan Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>RoyaleAPI Clan Manager</h1>
  <div class="header-controls">
    <input id="clanTagInput" type="text" placeholder="#ClanTag" />
    <input id="apiTokenInput" type="text" placeholder="API Token" />
    <button id="btnLoadApi">Tải từ API</button>
    <button id="btnLoadDemo">Dữ liệu Demo</button>
  </div>
</header>

<section class="kpi-grid">
  <div class="kpi-card"><span class="kpi-label">Tổng thành viên</span><span id="totalMembers" class="kpi-value">0</span></div>
  <div class="kpi-card"><span class="kpi-label">Hiệu suất TB</span><span id="avgEfficiency" class="kpi-value">0%</span></div>
  <div class="kpi-card"><span class="kpi-label">Tổng War Fame</span><span id="totalWarFame" class="kpi-value">0</span></div>
  <div class="kpi-card"><span class="kpi-label">Nguy cơ bị kick</span><span id="kickRiskCount" class="kpi-value">0</span></div>
</section>

<section id="clanInsightsPanel" class="insights-panel"></section>

<section class="filter-bar">
  <select id="statusFilter">
    <option value="all">Tất cả</option>
    <option value="active">Tích cực</option>
    <option value="warning">Cảnh báo</option>
    <option value="kick">Cần lọc</option>
  </select>
  <input id="searchInput" type="text" placeholder="Tìm tên / tag..." />
  <select id="sortBy">
    <option value="efficiency">Hiệu suất</option>
    <option value="fame">War Fame</option>
    <option value="donations">Donations</option>
    <option value="name">Tên</option>
  </select>
  <button id="btnExportKick">Xuất danh sách Kick</button>
  <button id="btnCopyTags">Copy Tags</button>
</section>

<section class="table-wrap">
  <table class="member-table">
    <thead><tr><th>#</th><th>Tên</th><th>Tag</th><th>Vai trò</th><th>Hiệu suất</th><th>War Fame</th><th>Donations</th><th>Trạng thái</th></tr></thead>
    <tbody id="memberTableBody"></tbody>
  </table>
</section>

<script src="clan-analytics.js"></script>
<script src="app.js"></script>
</body>
</html>
